[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deity"]

[project]
name = "deity"
version = "1.0.0"
description = "A model-agnostic AI Coding Agent Harness"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "openai>=3.41.0",
    "anthropic>=2.3.0",
    "aiosqlite>=0.22.1",
    "httpx2>=2.0,<3",
    "mcp==2.3.0",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
tui = ["textual>=0.86"]
chat = ["prompt_toolkit>=3.0.5,<4"]

[project.scripts]
deity = "deity.interfaces.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests/unit/test_shell_sessions.py", "tests/unit/test_approval_rules.py", "tests/unit/test_compact_summary.py"]
pythonpath = ["."]
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.mypy]
python_version = "3.12"
strict = true

# 可选 extras（chat/tui）未安装时不阻断类型检查：这两个包只在
# chat_input / tui.app 中以 try/except 方式可选导入，CI 默认只装 dev 依赖。
[[tool.mypy.overrides]]
module = ["prompt_toolkit", "prompt_toolkit.*", "textual", "textual.*"]
ignore_missing_imports = true

# extras 缺失时，上述两个消费模块里由 Any 基类/装饰器派生的错误同样忽略；
# extras 已安装（本地开发）时这些错误码本就不会触发，strict 其余检查不变。
[[tool.mypy.overrides]]
module = ["deity.interfaces.cli.chat_input", "deity.interfaces.tui.app"]
disable_error_code = ["untyped-decorator", "misc"]

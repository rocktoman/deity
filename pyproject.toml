[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deity"]

[project]
name = "deity"
version = "0.1.0"
description = "A model-agnostic AI Coding Agent Harness"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "openai>=3.41.0",
    "anthropic>=2.3.0",
    "aiosqlite>=0.22.1",
    "mcp==2.3.0",
    "jsonschema==4.26.0",
]

[project.scripts]
deity = "deity.interfaces.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.mypy]
python_version = "3.12"
strict = true
